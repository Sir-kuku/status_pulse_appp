# Local development only: MongoDB has no authentication and no host-published port.
# Use Atlas plus separate API/worker services for a hosted deployment.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try {
            const s = rs.status();
            quit(s.ok === 1 && db.hello().isWritablePrimary ? 0 : 1);
          } catch (e) {
            if (e.code === 94) {
              rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]});
            }
            quit(1);
          }
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  api:
    build: .
    image: status-pulse:local
    init: true
    environment: &app-environment
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/status_pulse?replicaSet=rs0
      MONGODB_DATABASE: status_pulse
      PUBLIC_BASE_URL: http://localhost:3000
      WORKER_CONCURRENCY: "4"
      WORKER_POLL_MS: "1000"
      SESSION_TTL_HOURS: "24"
      ENABLE_SIMULATIONS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    image: status-pulse:local
    init: true
    command: ["node", "dist/src/worker.js"]
    environment: *app-environment
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
