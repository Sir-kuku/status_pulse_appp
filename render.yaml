# Review before applying: the background worker uses a PAID Render compute plan.
# Database credentials are entered in Render, never committed here.
# Real email: add EMAIL_MODE=resend, EMAIL_FROM and RESEND_API_KEY to BOTH services.
# Until configured, production email is disabled (never simulated).
# Add GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET and GITHUB_CLIENT_ID/GITHUB_CLIENT_SECRET
# to the web service to enable social sign-in. See docs/email-and-sign-in-setup.md.
services:
  - type: web
    name: status-pulse-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: status_pulse
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ENABLE_SIMULATIONS
        value: "true"
  - type: worker
    name: status-pulse-worker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/src/worker.js
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: status_pulse
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: ENABLE_SIMULATIONS
        value: "true"
