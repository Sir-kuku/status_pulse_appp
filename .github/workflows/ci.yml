name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, validate contract, test with isolated replica set, and build
        run: npm run check
      - name: Install browser for workflow checks
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows and acceptance demonstration
        run: npm run test:e2e && npm run demo
      - name: Validate local container configuration
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker build --tag status-pulse:ci .
